<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dachluken – Konfiguration</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='/static/bootstrap.min.css'">
    <style>
        .field-edited { background-color: rgba(255, 193,  7, 0.25) !important; border-color: #ffc107 !important; }
    </style>
</head>
<body class="bg-light" x-data="configApp()">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a href="/" class="btn btn-sm btn-outline-light">&#8592; Zur&#252;ck</a>
            <span class="navbar-brand mb-0 mx-2 h6">&#9881; Konfiguration</span>
        </div>
    </nav>

    <!-- Error message (only shown when a field could not be persisted) -->
    <div x-show="errorMsg" class="alert alert-danger mx-3 mt-3 mb-0 py-2 small"
         x-text="errorMsg"></div>

    <!-- Legend -->
    <div class="alert alert-light border mx-3 mt-3 mb-0 py-2 small">
        <strong>&#8635;</strong> Zur&#252;cksetzen &ensp;
        <strong>&#10003;</strong> &#220;bernehmen (wird sofort dauerhaft gespeichert) &ensp;
        <strong>&#9654;</strong> Anfahren<br>
        <span class="px-2 me-1" style="background:rgba(255,193,7,.3)">&#9632;</span>editiert, noch nicht &#252;bernommen
    </div>

    <!-- Main content: hidden until config loaded -->
    <div class="container-sm py-3" x-show="loaded">
        <div class="accordion" id="cfgAccordion">

            <!-- ============================================================
                 Global settings: hatch (lever) servo + brake servo
                 ============================================================ -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button"
                            data-bs-toggle="collapse" data-bs-target="#panelGlobal">
                        Globale Einstellungen
                    </button>
                </h2>
                <div id="panelGlobal" class="accordion-collapse collapse show">
                    <div class="accordion-body">

                        <div class="fw-semibold small mb-2">Lukenservo (f&#252;r alle 4 Luken einheitlich)</div>

                        <label class="form-label small fw-semibold">Stellbereich</label>
                        <div class="input-group input-group-sm mb-3">
                            <button class="btn btn-outline-secondary" @click="resetF(hs.range_deg)">&#8635;</button>
                            <select class="form-select" :class="bgClass(hs.range_deg)"
                                    x-model="hs.range_deg.draft">
                                <option value="180">180&#176;</option>
                                <option value="270">270&#176;</option>
                            </select>
                            <button class="btn btn-outline-success"
                                    @click="acceptSelect(hs.range_deg)">&#10003;</button>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Impulszeit min (&#181;s)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(hs.pulse_min_us)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(hs.pulse_min_us)"
                                           x-model="hs.pulse_min_us.draft" min="500" max="2500">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(hs.pulse_min_us, 500, 2500)">&#10003;</button>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Impulszeit max (&#181;s)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(hs.pulse_max_us)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(hs.pulse_max_us)"
                                           x-model="hs.pulse_max_us.draft" min="500" max="2500">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(hs.pulse_max_us, 500, 2500)">&#10003;</button>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Hard-Stop min (&#176;)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(hs.hard_stop_min_deg)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(hs.hard_stop_min_deg)"
                                           x-model="hs.hard_stop_min_deg.draft" min="0" :max="hs.range_deg.committed">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(hs.hard_stop_min_deg, 0, hs.range_deg.committed)">&#10003;</button>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Hard-Stop max (&#176;)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(hs.hard_stop_max_deg)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(hs.hard_stop_max_deg)"
                                           x-model="hs.hard_stop_max_deg.draft" min="0" :max="hs.range_deg.committed">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(hs.hard_stop_max_deg, 0, hs.range_deg.committed)">&#10003;</button>
                                </div>
                            </div>
                        </div>

                        <label class="form-label small fw-semibold">Geschwindigkeit (&#176;/s)</label>
                        <div class="input-group input-group-sm mb-4">
                            <button class="btn btn-outline-secondary" @click="resetF(hs.speed_deg_per_s)">&#8635;</button>
                            <input type="number" class="form-control" :class="bgClass(hs.speed_deg_per_s)"
                                   x-model="hs.speed_deg_per_s.draft" min="1" max="500">
                            <button class="btn btn-outline-success"
                                    @click="acceptNum(hs.speed_deg_per_s, 1, 500)">&#10003;</button>
                        </div>

                        <div class="fw-semibold small mb-2">Bremsservo (f&#252;r alle 4 Luken einheitlich)</div>

                        <label class="form-label small fw-semibold">Stellbereich</label>
                        <div class="input-group input-group-sm mb-3">
                            <button class="btn btn-outline-secondary" @click="resetF(bs.range_deg)">&#8635;</button>
                            <select class="form-select" :class="bgClass(bs.range_deg)"
                                    x-model="bs.range_deg.draft">
                                <option value="180">180&#176;</option>
                                <option value="270">270&#176;</option>
                            </select>
                            <button class="btn btn-outline-success"
                                    @click="acceptSelect(bs.range_deg)">&#10003;</button>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Impulszeit min (&#181;s)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(bs.pulse_min_us)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(bs.pulse_min_us)"
                                           x-model="bs.pulse_min_us.draft" min="500" max="2500">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(bs.pulse_min_us, 500, 2500)">&#10003;</button>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Impulszeit max (&#181;s)</label>
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="resetF(bs.pulse_max_us)">&#8635;</button>
                                    <input type="number" class="form-control" :class="bgClass(bs.pulse_max_us)"
                                           x-model="bs.pulse_max_us.draft" min="500" max="2500">
                                    <button class="btn btn-outline-success"
                                            @click="acceptNum(bs.pulse_max_us, 500, 2500)">&#10003;</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div><!-- /global -->

            <!-- ============================================================
                 Hatch accordion items (one per hatch, generated by x-for)
                 ============================================================ -->
            <template x-for="(h, hi) in hatches" :key="hi">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse"
                                :data-bs-target="'#panelH' + hi">
                            <span x-text="h.name.committed"></span>
                        </button>
                    </h2>
                    <div :id="'panelH' + hi" class="accordion-collapse collapse">
                        <div class="accordion-body">

                            <!-- Name -->
                            <label class="form-label small fw-semibold">Name</label>
                            <div class="input-group input-group-sm mb-3">
                                <button class="btn btn-outline-secondary" @click="resetF(h.name)">&#8635;</button>
                                <input type="text" class="form-control" :class="bgClass(h.name)"
                                       x-model="h.name.draft">
                                <button class="btn btn-outline-success"
                                        @click="acceptStr(h.name, 32)">&#10003;</button>
                            </div>

                            <!-- Short name -->
                            <label class="form-label small fw-semibold">Kurzname (max.&#160;6&#160;Zeichen, OLED)</label>
                            <div class="input-group input-group-sm mb-3">
                                <button class="btn btn-outline-secondary" @click="resetF(h.short_name)">&#8635;</button>
                                <input type="text" class="form-control" :class="bgClass(h.short_name)"
                                       x-model="h.short_name.draft" maxlength="6">
                                <button class="btn btn-outline-success"
                                        @click="acceptStr(h.short_name, 6)">&#10003;</button>
                            </div>

                            <!-- Brake open/close angle (side by side) -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Bremse Auf (&#176;)</label>
                                    <div class="input-group input-group-sm">
                                        <button class="btn btn-outline-secondary" @click="resetF(h.brake_open_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(h.brake_open_deg)"
                                               x-model="h.brake_open_deg.draft" min="0" :max="bs.range_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(h.brake_open_deg, 0, bs.range_deg.committed)">&#10003;</button>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Bremse Zu (&#176;)</label>
                                    <div class="input-group input-group-sm">
                                        <button class="btn btn-outline-secondary" @click="resetF(h.brake_close_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(h.brake_close_deg)"
                                               x-model="h.brake_close_deg.draft" min="0" :max="bs.range_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(h.brake_close_deg, 0, bs.range_deg.committed)">&#10003;</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Positions list: positions[0] = ZU, positions[last] = AUF, fixed -->
                            <div class="fw-semibold small mb-2">Rastpositionen</div>

                            <template x-for="(pos, pi) in h.positions" :key="pi">
                                <div>
                                    <label class="form-label small"
                                           x-text="posLabel(pi, h.positions.length) + ' (&#176;)'">
                                    </label>
                                    <div class="input-group input-group-sm mb-2">
                                        <button class="btn btn-outline-secondary"
                                                @click="resetF(pos)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(pos)"
                                               x-model="pos.draft"
                                               :min="hs.hard_stop_min_deg.committed" :max="hs.hard_stop_max_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(pos, hs.hard_stop_min_deg.committed, hs.hard_stop_max_deg.committed)"
                                                title="&#220;bernehmen">&#10003;</button>
                                        <button class="btn btn-outline-info"
                                                :disabled="pos.draft !== '' + pos.committed"
                                                @click="testMove(hi, pos.committed)"
                                                title="Anfahren">&#9654;</button>
                                    </div>
                                </div>
                            </template>

                            <!-- Add / remove intermediate position; ZU and AUF stay fixed -->
                            <div class="d-flex gap-2 mt-1">
                                <button class="btn btn-sm btn-outline-secondary"
                                        @click="addPos(hi)">+ Zwischenposition</button>
                                <button class="btn btn-sm btn-outline-secondary"
                                        :disabled="h.positions.length <= 2"
                                        @click="removePos(hi)">&#8722; Zwischenposition</button>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

        </div><!-- /accordion -->

    </div><!-- /container -->

    <!-- Loading indicator -->
    <div x-show="!loaded" class="text-center text-muted py-5">
        <div class="spinner-border mb-2" role="status"></div>
        <div>Konfiguration wird geladen&hellip;</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            onerror="this.onerror=null;this.src='/static/bootstrap.bundle.min.js'"></script>
    <script>
    function configApp() {
        return {
            loaded:   false,
            errorMsg: '',
            hs:       {},   // hatch_servo (global, all 4 hatches)
            bs:       {},   // brake_servo (global, all 4 hatches)
            hatches:  [],

            /* ----------------------------------------------------------------
               Field factory: wraps a committed value plus an editable draft.
               Acceptance persists immediately - there is no separate
               "accepted but not yet saved" state anymore.
            ---------------------------------------------------------------- */
            fld(committed) {
                return { committed, draft: '' + committed };
            },

            /* ----------------------------------------------------------------
               CSS class for input field based on its state
            ---------------------------------------------------------------- */
            bgClass(f) {
                if (!f) return '';
                return (f.draft !== '' + f.committed) ? 'field-edited' : '';
            },

            /* ----------------------------------------------------------------
               Persist the full current document to the device. Called after
               every single field acceptance and every position add/remove.
               Returns true on success, false on failure (caller reverts).
            ---------------------------------------------------------------- */
            async persistConfig() {
                try {
                    const r = await fetch('/api/config', {
                        method:  'POST',
                        headers: {'Content-Type': 'application/json'},
                        body:    JSON.stringify(this.buildConfig()),
                    });
                    const d = await r.json();
                    if (d.error) {
                        this.errorMsg = 'Fehler: ' + d.error;
                        return false;
                    }
                    this.errorMsg = '';
                    return true;
                } catch (_) {
                    this.errorMsg = 'Netzwerkfehler beim Speichern.';
                    return false;
                }
            },

            /* ----------------------------------------------------------------
               Accept / reset helpers - accepting now persists immediately
            ---------------------------------------------------------------- */
            async acceptNum(f, min, max) {
                const v = Number(f.draft);
                if (!Number.isFinite(v) || v < min || v > max) return;
                const prev = f.committed;
                f.committed = v;
                if (!await this.persistConfig()) f.committed = prev;
            },

            async acceptStr(f, maxLen) {
                const v = f.draft.trim();
                if (!v || v.length > maxLen) return;
                const prev = f.committed;
                f.committed = v;
                f.draft     = v;   // normalise whitespace in the box
                if (!await this.persistConfig()) { f.committed = prev; f.draft = prev; }
            },

            async acceptSelect(f) {
                const v = Number(f.draft);
                const prev = f.committed;
                f.committed = v;
                if (!await this.persistConfig()) f.committed = prev;
            },

            resetF(f) {
                f.draft = '' + f.committed;
            },

            /* ----------------------------------------------------------------
               Position label: ZU / P2 … / AUF
            ---------------------------------------------------------------- */
            posLabel(idx, total) {
                if (idx === 0)          return 'ZU';
                if (idx === total - 1)  return 'AUF';
                return 'P' + (idx + 1);
            },

            /* ----------------------------------------------------------------
               Dynamic position management. positions[0] (ZU) and
               positions[length-1] (AUF) are the fixed end-stops and are
               never displaced - only intermediate positions are inserted
               before AUF / removed from just before AUF.
            ---------------------------------------------------------------- */
            async addPos(hi) {
                const h   = this.hatches[hi];
                const n   = h.positions.length;
                const idx = n - 1;  // insert directly before AUF
                const aufVal    = h.positions[n - 1].committed;
                const beforeVal = h.positions[n - 2].committed;  // last intermediate, or ZU
                const mid = Math.round((beforeVal + aufVal) / 2);
                h.positions.splice(idx, 0, this.fld(mid));
                if (!await this.persistConfig()) h.positions.splice(idx, 1);
            },

            async removePos(hi) {
                const h = this.hatches[hi];
                if (h.positions.length <= 2) return;
                const idx = h.positions.length - 2;  // last intermediate position
                const [removed] = h.positions.splice(idx, 1);
                if (!await this.persistConfig()) h.positions.splice(idx, 0, removed);
            },

            /* ----------------------------------------------------------------
               Test move: send accepted angle directly to task_control.
               No apply step needed - accepted values are already persisted
               and active in RAM by the time this can be clicked (the ▶
               button is disabled while a draft is unaccepted).
            ---------------------------------------------------------------- */
            testMove(hi, hatch_deg) {
                fetch('/api/hatch/' + hi + '/test', {
                    method:  'POST',
                    headers: {'Content-Type': 'application/json'},
                    body:    JSON.stringify({ hatch_deg }),
                });
            },

            /* ----------------------------------------------------------------
               Collect committed values into a config dict for POST
            ---------------------------------------------------------------- */
            buildConfig() {
                return {
                    global: {
                        hatch_servo: {
                            range_deg:         this.hs.range_deg.committed,
                            pulse_min_us:      this.hs.pulse_min_us.committed,
                            pulse_max_us:      this.hs.pulse_max_us.committed,
                            hard_stop_min_deg: this.hs.hard_stop_min_deg.committed,
                            hard_stop_max_deg: this.hs.hard_stop_max_deg.committed,
                            speed_deg_per_s:   this.hs.speed_deg_per_s.committed,
                        },
                        brake_servo: {
                            range_deg:    this.bs.range_deg.committed,
                            pulse_min_us: this.bs.pulse_min_us.committed,
                            pulse_max_us: this.bs.pulse_max_us.committed,
                        },
                    },
                    hatches: this.hatches.map(h => ({
                        name:            h.name.committed,
                        short_name:      h.short_name.committed,
                        brake_open_deg:  h.brake_open_deg.committed,
                        brake_close_deg: h.brake_close_deg.committed,
                        positions:       h.positions.map(p => ({ hatch_deg: p.committed })),
                    })),
                };
            },

            /* ----------------------------------------------------------------
               Initialise: load config from server and build field wrappers
            ---------------------------------------------------------------- */
            init() {
                fetch('/api/config')
                    .then(r => r.json())
                    .then(cfg => {
                        const HS = cfg.global.hatch_servo;
                        const BS = cfg.global.brake_servo;
                        this.hs = {
                            range_deg:         this.fld(HS.range_deg),
                            pulse_min_us:      this.fld(HS.pulse_min_us),
                            pulse_max_us:      this.fld(HS.pulse_max_us),
                            hard_stop_min_deg: this.fld(HS.hard_stop_min_deg),
                            hard_stop_max_deg: this.fld(HS.hard_stop_max_deg),
                            speed_deg_per_s:   this.fld(HS.speed_deg_per_s),
                        };
                        this.bs = {
                            range_deg:    this.fld(BS.range_deg),
                            pulse_min_us: this.fld(BS.pulse_min_us),
                            pulse_max_us: this.fld(BS.pulse_max_us),
                        };
                        this.hatches = cfg.hatches.map(h => ({
                            name:            this.fld(h.name),
                            short_name:      this.fld(h.short_name),
                            brake_open_deg:  this.fld(h.brake_open_deg),
                            brake_close_deg: this.fld(h.brake_close_deg),
                            positions:       h.positions.map(p => this.fld(p.hatch_deg)),
                        }));
                        this.loaded = true;
                    })
                    .catch(() => {
                        this.errorMsg = 'Konfiguration konnte nicht geladen werden.';
                    });
            },
        };
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
            onerror="this.onerror=null;this.src='/static/alpine.min.js'"></script>
</body>
</html>

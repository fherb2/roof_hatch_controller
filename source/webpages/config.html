<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dachluken – Konfiguration</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='/static/bootstrap.min.css'">
    <style>
        .field-edited { background-color: rgba(255, 193,  7, 0.25) !important; border-color: #ffc107 !important; }
        .servo-col-title { font-size: 1.05rem; font-weight: 700; }
        .servo-col-right { border-left: 1px solid #dee2e6; }
        @media (max-width: 767px) { .servo-col-right { border-left: none; border-top: 1px solid #dee2e6; padding-top: .75rem; margin-top: .5rem; } }
        .go-gap { margin-left: .75rem; }
    </style>
</head>
<body class="bg-light" x-data="configApp()">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a href="/" class="btn btn-sm btn-outline-light" x-text="t('back')"></a>
            <span class="navbar-brand mb-0 mx-2 h6" x-text="t('title')"></span>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" style="width:auto" x-model="lang">
                    <option value="de">DE</option>
                    <option value="en">EN</option>
                </select>
                <button class="btn btn-sm btn-outline-light" @click="downloadConfig()" x-text="t('download')"></button>
            </div>
        </div>
    </nav>

    <!-- Error message (only shown when a field could not be persisted) -->
    <div x-show="errorMsg" class="alert alert-danger mx-3 mt-3 mb-0 py-2 small"
         x-text="errorMsg"></div>

    <!-- Legend -->
    <div class="alert alert-light border mx-3 mt-3 mb-0 py-2 small">
        <strong>&#8635;</strong> <span x-text="t('legend_reset')"></span> &ensp;
        <strong>&#10003;</strong> <span x-text="t('legend_accept')"></span> &ensp;
        <strong>&#9654;</strong> <span x-text="t('legend_go')"></span><br>
        <span class="px-2 me-1" style="background:rgba(255,193,7,.3)">&#9632;</span><span x-text="t('legend_edited')"></span>
    </div>

    <!-- Main content: hidden until config loaded -->
    <div class="container-lg py-3" x-show="loaded">
        <div class="accordion" id="cfgAccordion">

            <!-- ============================================================
                 One accordion item per hatch, fully independent
                 ============================================================ -->
            <template x-for="(h, hi) in hatches" :key="hi">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse" :data-bs-target="'#panelH' + hi">
                            <span x-text="h.name.committed"></span>
                        </button>
                    </h2>
                    <div :id="'panelH' + hi" class="accordion-collapse collapse">
                        <div class="accordion-body">

                            <!-- Name -->
                            <label class="form-label small fw-semibold" x-text="t('name')"></label>
                            <div class="input-group input-group-sm mb-3">
                                <button class="btn btn-outline-secondary" @click="resetF(h.name)">&#8635;</button>
                                <input type="text" class="form-control" :class="bgClass(h.name)" x-model="h.name.draft">
                                <button class="btn btn-outline-success" @click="acceptStr(h.name, 32)">&#10003;</button>
                            </div>

                            <!-- Short name -->
                            <label class="form-label small fw-semibold" x-text="t('short_name')"></label>
                            <div class="input-group input-group-sm mb-3">
                                <button class="btn btn-outline-secondary" @click="resetF(h.short_name)">&#8635;</button>
                                <input type="text" class="form-control" :class="bgClass(h.short_name)"
                                       x-model="h.short_name.draft" maxlength="11">
                                <button class="btn btn-outline-success" @click="acceptStr(h.short_name, 11)">&#10003;</button>
                            </div>

                            <!-- PWM frequency: shared by hatch_servo + brake_servo of this channel -->
                            <label class="form-label small fw-semibold" x-text="t('pwm_freq') + ' (' + t('this_channel') + ')'"></label>
                            <div class="input-group input-group-sm mb-4">
                                <button class="btn btn-outline-secondary" @click="resetF(h.pwm_freq_hz)">&#8635;</button>
                                <input type="number" class="form-control" :class="bgClass(h.pwm_freq_hz)"
                                       x-model="h.pwm_freq_hz.draft" min="50" max="400">
                                <button class="btn btn-outline-success" @click="acceptNum(h.pwm_freq_hz, 50, 400)">&#10003;</button>
                            </div>

                            <div class="row">
                                <!-- ================= Hebelservo column ================= -->
                                <div class="col-md-6">
                                    <div class="servo-col-title mb-2" x-text="t('hatch_servo') + ', ' + t('channel') + ' ' + (hi + 1)"></div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('range')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.range_deg)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(h.hatch_servo.range_deg)" x-model="h.hatch_servo.range_deg.draft">
                                                    <option value="180">180&#176;</option>
                                                    <option value="270">270&#176;</option>
                                                    <option value="360">360&#176;</option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptSelect(h.hatch_servo.range_deg)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('direction')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.direction)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(h.hatch_servo.direction)" x-model="h.hatch_servo.direction.draft">
                                                    <option value="neg" x-text="t('dir_neg')"></option>
                                                    <option value="pos" x-text="t('dir_pos')"></option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptStrSelect(h.hatch_servo.direction)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('speed')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.speed_deg_per_s)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.hatch_servo.speed_deg_per_s)"
                                                       x-model="h.hatch_servo.speed_deg_per_s.draft" min="30" max="180">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.hatch_servo.speed_deg_per_s, 30, 180)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' 0&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.pulse_min_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.hatch_servo.pulse_min_us)"
                                                       x-model="h.hatch_servo.pulse_min_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.hatch_servo.pulse_min_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' ' + h.hatch_servo.range_deg.committed + '&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.pulse_max_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.hatch_servo.pulse_max_us)"
                                                       x-model="h.hatch_servo.pulse_max_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.hatch_servo.pulse_max_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_min')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.hard_stop_min_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.hatch_servo.hard_stop_min_deg)"
                                                       x-model="h.hatch_servo.hard_stop_min_deg.draft" min="0" :max="h.hatch_servo.range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.hatch_servo.hard_stop_min_deg, 0, h.hatch_servo.range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_max')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.hard_stop_max_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.hatch_servo.hard_stop_max_deg)"
                                                       x-model="h.hatch_servo.hard_stop_max_deg.draft" min="0" :max="h.hatch_servo.range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.hatch_servo.hard_stop_max_deg, 0, h.hatch_servo.range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <label class="form-label small fw-semibold" x-text="t('mount_angle')"></label>
                                    <div class="input-group input-group-sm mb-3">
                                        <button class="btn btn-outline-secondary" @click="resetF(h.hatch_servo.mount_angle_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(h.hatch_servo.mount_angle_deg)"
                                               x-model="h.hatch_servo.mount_angle_deg.draft"
                                               :min="h.hatch_servo.hard_stop_min_deg.committed" :max="h.hatch_servo.hard_stop_max_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(h.hatch_servo.mount_angle_deg, h.hatch_servo.hard_stop_min_deg.committed, h.hatch_servo.hard_stop_max_deg.committed)">&#10003;</button>
                                        <button class="btn btn-outline-info go-gap"
                                                :disabled="h.hatch_servo.mount_angle_deg.draft !== '' + h.hatch_servo.mount_angle_deg.committed"
                                                @click="testMove(hi, h.hatch_servo.mount_angle_deg.committed)">&#9654;</button>
                                    </div>

                                    <!-- Positions: ZU / P2... / AUF, fixed end-stops -->
                                    <div class="fw-semibold small mb-2" x-text="t('positions')"></div>
                                    <template x-for="(pos, pi) in h.positions" :key="pi">
                                        <div>
                                            <label class="form-label small" x-text="posLabel(pi, h.positions.length) + ' (&#176;)'"></label>
                                            <div class="input-group input-group-sm mb-2">
                                                <button class="btn btn-outline-secondary" @click="resetF(pos)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(pos)" x-model="pos.draft"
                                                       :min="h.hatch_servo.hard_stop_min_deg.committed" :max="h.hatch_servo.hard_stop_max_deg.committed">
                                                <button class="btn btn-outline-success"
                                                        @click="acceptNum(pos, h.hatch_servo.hard_stop_min_deg.committed, h.hatch_servo.hard_stop_max_deg.committed)">&#10003;</button>
                                                <button class="btn btn-outline-info"
                                                        :disabled="pos.draft !== '' + pos.committed"
                                                        @click="testMove(hi, pos.committed)">&#9654;</button>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="d-flex gap-2 mt-1 mb-3">
                                        <button class="btn btn-sm btn-outline-secondary" @click="addPos(hi)" x-text="'+ ' + t('add_pos')"></button>
                                        <button class="btn btn-sm btn-outline-secondary" :disabled="h.positions.length <= 2"
                                                @click="removePos(hi)" x-text="'&#8722; ' + t('remove_pos')"></button>
                                    </div>
                                </div>

                                <!-- ================= Halteservo column ================= -->
                                <div class="col-md-6 servo-col-right">
                                    <div class="servo-col-title mb-2" x-text="t('brake_servo') + ', ' + t('channel') + ' ' + (hi + 1)"></div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('range')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.range_deg)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(h.brake_servo.range_deg)" x-model="h.brake_servo.range_deg.draft">
                                                    <option value="180">180&#176;</option>
                                                    <option value="270">270&#176;</option>
                                                    <option value="360">360&#176;</option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptSelect(h.brake_servo.range_deg)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('direction')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.direction)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(h.brake_servo.direction)" x-model="h.brake_servo.direction.draft">
                                                    <option value="neg" x-text="t('dir_neg')"></option>
                                                    <option value="pos" x-text="t('dir_pos')"></option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptStrSelect(h.brake_servo.direction)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('speed')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.speed_deg_per_s)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.speed_deg_per_s)"
                                                       x-model="h.brake_servo.speed_deg_per_s.draft" min="30" max="180">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.brake_servo.speed_deg_per_s, 30, 180)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' 0&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.pulse_min_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.pulse_min_us)"
                                                       x-model="h.brake_servo.pulse_min_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.brake_servo.pulse_min_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' ' + h.brake_servo.range_deg.committed + '&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.pulse_max_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.pulse_max_us)"
                                                       x-model="h.brake_servo.pulse_max_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.brake_servo.pulse_max_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_min')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.hard_stop_min_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.hard_stop_min_deg)"
                                                       x-model="h.brake_servo.hard_stop_min_deg.draft" min="0" :max="h.brake_servo.range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.brake_servo.hard_stop_min_deg, 0, h.brake_servo.range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_max')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.hard_stop_max_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.hard_stop_max_deg)"
                                                       x-model="h.brake_servo.hard_stop_max_deg.draft" min="0" :max="h.brake_servo.range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(h.brake_servo.hard_stop_max_deg, 0, h.brake_servo.range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('brake_open')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.open_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.open_deg)"
                                                       x-model="h.brake_servo.open_deg.draft"
                                                       :min="h.brake_servo.hard_stop_min_deg.committed" :max="h.brake_servo.hard_stop_max_deg.committed">
                                                <button class="btn btn-outline-success"
                                                        @click="acceptNum(h.brake_servo.open_deg, h.brake_servo.hard_stop_min_deg.committed, h.brake_servo.hard_stop_max_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('brake_close')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.close_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(h.brake_servo.close_deg)"
                                                       x-model="h.brake_servo.close_deg.draft"
                                                       :min="h.brake_servo.hard_stop_min_deg.committed" :max="h.brake_servo.hard_stop_max_deg.committed">
                                                <button class="btn btn-outline-success"
                                                        @click="acceptNum(h.brake_servo.close_deg, h.brake_servo.hard_stop_min_deg.committed, h.brake_servo.hard_stop_max_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <label class="form-label small fw-semibold" x-text="t('mount_angle')"></label>
                                    <div class="input-group input-group-sm mb-3">
                                        <button class="btn btn-outline-secondary" @click="resetF(h.brake_servo.mount_angle_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(h.brake_servo.mount_angle_deg)"
                                               x-model="h.brake_servo.mount_angle_deg.draft"
                                               :min="h.brake_servo.hard_stop_min_deg.committed" :max="h.brake_servo.hard_stop_max_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(h.brake_servo.mount_angle_deg, h.brake_servo.hard_stop_min_deg.committed, h.brake_servo.hard_stop_max_deg.committed)">&#10003;</button>
                                        <button class="btn btn-outline-info go-gap"
                                                :disabled="h.brake_servo.mount_angle_deg.draft !== '' + h.brake_servo.mount_angle_deg.committed"
                                                @click="brakeTestMove(hi, h.brake_servo.mount_angle_deg.committed)">&#9654;</button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

            <!-- ============================================================
                 Servo tester: next free channel pair, permanently powered
                 ============================================================ -->
            <template x-if="loaded && tester.pwm_freq_hz">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#panelTester">
                        <span x-text="t('servo_tester')"></span>
                    </button>
                </h2>
                <div id="panelTester" class="accordion-collapse collapse">
                    <div class="accordion-body">
                        <div class="alert alert-warning small" x-text="t('servo_tester_hint')"></div>

                        <label class="form-label small fw-semibold" x-text="t('pwm_freq')"></label>
                        <div class="input-group input-group-sm mb-4">
                            <button class="btn btn-outline-secondary" @click="resetF(tester.pwm_freq_hz)">&#8635;</button>
                            <input type="number" class="form-control" :class="bgClass(tester.pwm_freq_hz)"
                                   x-model="tester.pwm_freq_hz.draft" min="50" max="400">
                            <button class="btn btn-outline-success" @click="acceptNum(tester.pwm_freq_hz, 50, 400)">&#10003;</button>
                        </div>

                        <div class="row">
                            <template x-for="side in ['hatch_servo', 'brake_servo']" :key="side">
                                <div class="col-md-6" :class="side === 'brake_servo' ? 'servo-col-right' : ''">
                                    <div class="servo-col-title mb-2" x-text="t(side)"></div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('range')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].range_deg)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(tester[side].range_deg)" x-model="tester[side].range_deg.draft">
                                                    <option value="180">180&#176;</option>
                                                    <option value="270">270&#176;</option>
                                                    <option value="360">360&#176;</option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptSelect(tester[side].range_deg)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('direction')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].direction)">&#8635;</button>
                                                <select class="form-select" :class="bgClass(tester[side].direction)" x-model="tester[side].direction.draft">
                                                    <option value="neg" x-text="t('dir_neg')"></option>
                                                    <option value="pos" x-text="t('dir_pos')"></option>
                                                </select>
                                                <button class="btn btn-outline-success" @click="acceptStrSelect(tester[side].direction)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-semibold" x-text="t('speed')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].speed_deg_per_s)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(tester[side].speed_deg_per_s)"
                                                       x-model="tester[side].speed_deg_per_s.draft" min="30" max="180">
                                                <button class="btn btn-outline-success" @click="acceptNum(tester[side].speed_deg_per_s, 30, 180)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' 0&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].pulse_min_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(tester[side].pulse_min_us)"
                                                       x-model="tester[side].pulse_min_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(tester[side].pulse_min_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('pulse_at') + ' ' + tester[side].range_deg.committed + '&#176;'"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].pulse_max_us)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(tester[side].pulse_max_us)"
                                                       x-model="tester[side].pulse_max_us.draft" min="500" max="4000">
                                                <button class="btn btn-outline-success" @click="acceptNum(tester[side].pulse_max_us, 500, 4000)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_min')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].hard_stop_min_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(tester[side].hard_stop_min_deg)"
                                                       x-model="tester[side].hard_stop_min_deg.draft" min="0" :max="tester[side].range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(tester[side].hard_stop_min_deg, 0, tester[side].range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-semibold" x-text="t('hard_stop_max')"></label>
                                            <div class="input-group input-group-sm">
                                                <button class="btn btn-outline-secondary" @click="resetF(tester[side].hard_stop_max_deg)">&#8635;</button>
                                                <input type="number" class="form-control" :class="bgClass(tester[side].hard_stop_max_deg)"
                                                       x-model="tester[side].hard_stop_max_deg.draft" min="0" :max="tester[side].range_deg.committed">
                                                <button class="btn btn-outline-success" @click="acceptNum(tester[side].hard_stop_max_deg, 0, tester[side].range_deg.committed)">&#10003;</button>
                                            </div>
                                        </div>
                                    </div>

                                    <label class="form-label small fw-semibold" x-text="t('test_angle_a')"></label>
                                    <div class="input-group input-group-sm mb-2">
                                        <button class="btn btn-outline-secondary" @click="resetF(tester[side].test_angle_a_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(tester[side].test_angle_a_deg)"
                                               x-model="tester[side].test_angle_a_deg.draft"
                                               :min="tester[side].hard_stop_min_deg.committed" :max="tester[side].hard_stop_max_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(tester[side].test_angle_a_deg, tester[side].hard_stop_min_deg.committed, tester[side].hard_stop_max_deg.committed)">&#10003;</button>
                                        <button class="btn btn-outline-info go-gap"
                                                :disabled="tester[side].test_angle_a_deg.draft !== '' + tester[side].test_angle_a_deg.committed"
                                                @click="testerMove(side === 'hatch_servo' ? 'hatch' : 'brake', tester[side].test_angle_a_deg.committed)">&#9654;</button>
                                    </div>

                                    <label class="form-label small fw-semibold" x-text="t('test_angle_b')"></label>
                                    <div class="input-group input-group-sm mb-3">
                                        <button class="btn btn-outline-secondary" @click="resetF(tester[side].test_angle_b_deg)">&#8635;</button>
                                        <input type="number" class="form-control" :class="bgClass(tester[side].test_angle_b_deg)"
                                               x-model="tester[side].test_angle_b_deg.draft"
                                               :min="tester[side].hard_stop_min_deg.committed" :max="tester[side].hard_stop_max_deg.committed">
                                        <button class="btn btn-outline-success"
                                                @click="acceptNum(tester[side].test_angle_b_deg, tester[side].hard_stop_min_deg.committed, tester[side].hard_stop_max_deg.committed)">&#10003;</button>
                                        <button class="btn btn-outline-info go-gap"
                                                :disabled="tester[side].test_angle_b_deg.draft !== '' + tester[side].test_angle_b_deg.committed"
                                                @click="testerMove(side === 'hatch_servo' ? 'hatch' : 'brake', tester[side].test_angle_b_deg.committed)">&#9654;</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
            </template>

        </div><!-- /accordion -->
    </div><!-- /container -->

    <!-- Loading indicator -->
    <div x-show="!loaded" class="text-center text-muted py-5">
        <div class="spinner-border mb-2" role="status"></div>
        <div x-text="t('loading')"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            onerror="this.onerror=null;this.src='/static/bootstrap.bundle.min.js'"></script>
    <script>
    const I18N = {
        de: {
            back: '\u2190 Zur\u00fcck', title: '\u2699 Konfiguration', download: 'Herunterladen',
            legend_reset: 'Zur\u00fccksetzen', legend_accept: '\u00dcbernehmen (wird sofort dauerhaft gespeichert)',
            legend_go: 'Anfahren', legend_edited: 'editiert, noch nicht \u00fcbernommen',
            name: 'Name', short_name: 'Kurzname (max. 11 Zeichen, OLED)',
            pwm_freq: 'PWM-Frequenz (Hz)', this_channel: 'dieser Kanal',
            hatch_servo: 'Hebelservo', brake_servo: 'Halteservo', channel: 'Kanal',
            range: 'Stellbereich', direction: 'Drehrichtung', dir_pos: 'pos', dir_neg: 'neg',
            speed: 'Geschwindigkeit (\u00b0/s)', pulse_at: 'Impulszeit bei',
            hard_stop_min: 'Hard-Stop min (\u00b0)', hard_stop_max: 'Hard-Stop max (\u00b0)',
            mount_angle: 'Montagewinkel (\u00b0)', brake_open: 'Bremse Auf (\u00b0)', brake_close: 'Bremse Zu (\u00b0)',
            positions: 'Rastpositionen', add_pos: 'Zwischenposition', remove_pos: 'Zwischenposition',
            servo_tester: 'Servotester',
            servo_tester_hint: 'Nur f\u00fcr ausgebaute, unbelastete Servos. Die PWM-Frequenz ist unabh\u00e4ngig von den 4 Kan\u00e4len und wird nur aktiv, solange kein Kanal f\u00e4hrt.',
            test_angle_a: 'Testwinkel A (\u00b0)', test_angle_b: 'Testwinkel B (\u00b0)',
            loading: 'Konfiguration wird geladen\u2026',
        },
        en: {
            back: '\u2190 Back', title: '\u2699 Configuration', download: 'Download',
            legend_reset: 'Reset', legend_accept: 'Accept (saved immediately, permanently)',
            legend_go: 'Move', legend_edited: 'edited, not yet accepted',
            name: 'Name', short_name: 'Short name (max. 11 chars, OLED)',
            pwm_freq: 'PWM frequency (Hz)', this_channel: 'this channel',
            hatch_servo: 'Lever servo', brake_servo: 'Latch servo', channel: 'channel',
            range: 'Range', direction: 'Direction', dir_pos: 'pos', dir_neg: 'neg',
            speed: 'Speed (\u00b0/s)', pulse_at: 'Pulse width at',
            hard_stop_min: 'Hard stop min (\u00b0)', hard_stop_max: 'Hard stop max (\u00b0)',
            mount_angle: 'Mounting angle (\u00b0)', brake_open: 'Latch open (\u00b0)', brake_close: 'Latch closed (\u00b0)',
            positions: 'Positions', add_pos: 'intermediate position', remove_pos: 'intermediate position',
            servo_tester: 'Servo tester',
            servo_tester_hint: 'For servos removed from the hatches only. The PWM frequency is independent of the 4 channels and only active while no channel is driving.',
            test_angle_a: 'Test angle A (\u00b0)', test_angle_b: 'Test angle B (\u00b0)',
            loading: 'Loading configuration\u2026',
        },
    };

    function configApp() {
        return {
            loaded:   false,
            errorMsg: '',
            lang:     (navigator.language || 'de').slice(0, 2) === 'en' ? 'en' : 'de',
            hatches:  [],
            tester:   {},

            t(key) {
                return (I18N[this.lang] && I18N[this.lang][key]) || key;
            },

            /* ----------------------------------------------------------------
               Field factory: wraps a committed value plus an editable draft.
            ---------------------------------------------------------------- */
            fld(committed) {
                return { committed, draft: '' + committed };
            },

            /* ----------------------------------------------------------------
               Wrap/unwrap a full hatch_servo or brake_servo config block.
               extraKeys covers the fields that differ between hatch_servo,
               brake_servo and the servo tester's own blocks (mount_angle_deg,
               open_deg/close_deg, test_angle_a/b_deg).
            ---------------------------------------------------------------- */
            fldServo(cfg, extraKeys = []) {
                const obj = {
                    range_deg:         this.fld(cfg.range_deg),
                    direction:         this.fld(cfg.direction),
                    speed_deg_per_s:   this.fld(cfg.speed_deg_per_s),
                    pulse_min_us:      this.fld(cfg.pulse_min_us),
                    pulse_max_us:      this.fld(cfg.pulse_max_us),
                    hard_stop_min_deg: this.fld(cfg.hard_stop_min_deg),
                    hard_stop_max_deg: this.fld(cfg.hard_stop_max_deg),
                };
                for (const k of extraKeys) obj[k] = this.fld(cfg[k]);
                return obj;
            },

            servoOut(f, extraKeys = []) {
                const obj = {
                    range_deg:         f.range_deg.committed,
                    direction:         f.direction.committed,
                    speed_deg_per_s:   f.speed_deg_per_s.committed,
                    pulse_min_us:      f.pulse_min_us.committed,
                    pulse_max_us:      f.pulse_max_us.committed,
                    hard_stop_min_deg: f.hard_stop_min_deg.committed,
                    hard_stop_max_deg: f.hard_stop_max_deg.committed,
                };
                for (const k of extraKeys) obj[k] = f[k].committed;
                return obj;
            },

            /* ----------------------------------------------------------------
               CSS class for input field based on its state
            ---------------------------------------------------------------- */
            bgClass(f) {
                if (!f) return '';
                return (f.draft !== '' + f.committed) ? 'field-edited' : '';
            },

            /* ----------------------------------------------------------------
               Persist the full current document to the device.
            ---------------------------------------------------------------- */
            async persistConfig() {
                // buildConfig() deliberately runs OUTSIDE the network try
                // block: a JS error here is a client-side bug, not a
                // network failure, and must not be reported as one.
                let payload;
                try {
                    payload = JSON.stringify(this.buildConfig());
                } catch (e) {
                    this.errorMsg = 'Client error in buildConfig(): ' + e;
                    return false;
                }
                let r;
                try {
                    r = await fetch('/api/config', {
                        method:  'POST',
                        headers: {'Content-Type': 'application/json'},
                        body:    payload,
                    });
                } catch (e) {
                    this.errorMsg = 'Network error while saving: ' + e;
                    return false;
                }
                // Try to parse as JSON regardless of status first: our own
                // post_config() always returns valid JSON with an "error"
                // field for a rejected value (HTTP 400) - that is a normal
                // input mistake, not a server malfunction, and should read
                // like one. Only a body that fails to parse as JSON at all
                // indicates a genuine server-side failure (crash/garbled
                // response).
                const raw = await r.text();
                let d;
                try {
                    d = JSON.parse(raw);
                } catch (e) {
                    this.errorMsg = 'Server error ' + r.status + ': ' + raw.slice(0, 200);
                    return false;
                }
                if (d.error) { this.errorMsg = d.error; return false; }
                this.errorMsg = '';
                return true;
            },

            /* ----------------------------------------------------------------
               Accept/reset a single field's draft value. accept* validates
               locally, optimistically commits, persists, and rolls the
               commit back if persistConfig() reports a rejection - draft
               is left untouched so the user can see and fix what they typed.
            ---------------------------------------------------------------- */
            async acceptNum(f, min, max) {
                const v = Number(f.draft);
                if (!Number.isFinite(v) || v < min || v > max) return;
                const prev = f.committed;
                f.committed = v;
                if (!await this.persistConfig()) f.committed = prev;
            },

            async acceptStr(f, maxLen) {
                const v = f.draft.trim();
                if (!v || v.length > maxLen) return;
                const prev = f.committed;
                f.committed = v;
                f.draft     = v;
                if (!await this.persistConfig()) { f.committed = prev; f.draft = prev; }
            },

            async acceptSelect(f) {
                const v = Number(f.draft);
                const prev = f.committed;
                f.committed = v;
                if (!await this.persistConfig()) f.committed = prev;
            },

            async acceptStrSelect(f) {
                const v = f.draft;
                const prev = f.committed;
                f.committed = v;
                if (!await this.persistConfig()) f.committed = prev;
            },

            resetF(f) {
                f.draft = '' + f.committed;
            },

            /* ----------------------------------------------------------------
               Position list: positions[0] is always ZU, positions[-1] is
               always AUF and neither ever moves - addPos()/removePos() only
               ever insert/remove the intermediate entry closest to AUF.
            ---------------------------------------------------------------- */
            posLabel(idx, total) {
                if (idx === 0)          return 'ZU';
                if (idx === total - 1)  return 'AUF';
                return 'P' + (idx + 1);
            },

            async addPos(hi) {
                const h   = this.hatches[hi];
                const n   = h.positions.length;
                const idx = n - 1;
                const aufVal    = h.positions[n - 1].committed;
                const beforeVal = h.positions[n - 2].committed;
                const mid = Math.round((beforeVal + aufVal) / 2);
                h.positions.splice(idx, 0, this.fld(mid));
                if (!await this.persistConfig()) h.positions.splice(idx, 1);
            },

            async removePos(hi) {
                const h = this.hatches[hi];
                if (h.positions.length <= 2) return;
                const idx = h.positions.length - 2;
                const [removed] = h.positions.splice(idx, 1);
                if (!await this.persistConfig()) h.positions.splice(idx, 0, removed);
            },

            /* ----------------------------------------------------------------
               Movement triggers - fire and forget, task_control does the work
            ---------------------------------------------------------------- */
            testMove(hi, hatch_deg) {
                fetch('/api/hatch/' + hi + '/test', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ hatch_deg }),
                });
            },

            brakeTestMove(hi, brake_deg) {
                fetch('/api/hatch/' + hi + '/brake_test', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ brake_deg }),
                });
            },

            testerMove(which, angle_deg) {
                fetch('/api/tester/' + which, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ angle_deg }),
                });
            },

            /* ----------------------------------------------------------------
               Download the currently persisted configuration as a file
            ---------------------------------------------------------------- */
            downloadConfig() {
                const blob = new Blob([JSON.stringify(this.buildConfig(), null, 4)],
                                       {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a   = document.createElement('a');
                a.href = url;
                a.download = 'config.json';
                a.click();
                URL.revokeObjectURL(url);
            },

            /* ----------------------------------------------------------------
               Collect committed values into a config dict for POST
            ---------------------------------------------------------------- */
            buildConfig() {
                return {
                    global: {
                        servo_tester: {
                            pwm_freq_hz: this.tester.pwm_freq_hz.committed,
                            hatch_servo: this.servoOut(this.tester.hatch_servo, ['test_angle_a_deg', 'test_angle_b_deg']),
                            brake_servo: this.servoOut(this.tester.brake_servo, ['test_angle_a_deg', 'test_angle_b_deg']),
                        },
                    },
                    hatches: this.hatches.map(h => ({
                        name:        h.name.committed,
                        short_name:  h.short_name.committed,
                        pwm_freq_hz: h.pwm_freq_hz.committed,
                        hatch_servo: this.servoOut(h.hatch_servo, ['mount_angle_deg']),
                        brake_servo: this.servoOut(h.brake_servo, ['mount_angle_deg', 'open_deg', 'close_deg']),
                        positions:   h.positions.map(p => ({ hatch_deg: p.committed })),
                    })),
                };
            },

            /* ----------------------------------------------------------------
               Initialise: load config from server and build field wrappers
            ---------------------------------------------------------------- */
            init() {
                fetch('/api/config')
                    .then(r => r.json())
                    .then(cfg => {
                        const st = cfg.global.servo_tester;
                        this.tester = {
                            pwm_freq_hz: this.fld(st.pwm_freq_hz),
                            hatch_servo: this.fldServo(st.hatch_servo, ['test_angle_a_deg', 'test_angle_b_deg']),
                            brake_servo: this.fldServo(st.brake_servo, ['test_angle_a_deg', 'test_angle_b_deg']),
                        };
                        this.hatches = cfg.hatches.map(h => ({
                            name:        this.fld(h.name),
                            short_name:  this.fld(h.short_name),
                            pwm_freq_hz: this.fld(h.pwm_freq_hz),
                            hatch_servo: this.fldServo(h.hatch_servo, ['mount_angle_deg']),
                            brake_servo: this.fldServo(h.brake_servo, ['mount_angle_deg', 'open_deg', 'close_deg']),
                            positions:   h.positions.map(p => this.fld(p.hatch_deg)),
                        }));
                        this.loaded = true;
                    })
                    .catch(() => {
                        this.errorMsg = 'Configuration could not be loaded.';
                    });
            },
        };
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
            onerror="this.onerror=null;this.src='/static/alpine.min.js'"></script>
